<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f8"><title>学習計画コーチング</title>
<style>
:root{--ink:#202633;--muted:#687386;--line:#dfe4eb;--bg:#f4f6f8;--blue:#365f91;--soft:#edf3f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif}header{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);padding:13px 18px;z-index:2}.top,.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{max-width:1100px;margin:auto}.brand{font-weight:750}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:400}.wrap{max-width:1100px;margin:20px auto;padding:0 15px 45px}.layout{display:grid;grid-template-columns:235px minmax(0,1fr);gap:16px}aside,.panel{background:white;border:1px solid var(--line);border-radius:13px}aside{padding:13px;height:max-content;position:sticky;top:78px}.panel{padding:18px;margin-bottom:14px}h2{font-size:18px;margin:0 0 13px}.hint,.sub{font-size:12px;color:var(--muted)}.sub{margin:-7px 0 13px}.list{display:grid;gap:7px;margin:10px 0}.student-row{display:flex;gap:5px;align-items:stretch;min-width:0}.student-row .student{flex:1;min-width:0}.student{background:white;border:1px solid var(--line);border-radius:8px;padding:10px;text-align:left}.student.active{border-color:var(--blue);background:var(--soft)}.student small{display:block;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:4px;min-width:0}.field.full{grid-column:1/-1}label{font-size:13px;font-weight:650;color:#465164}input,select,textarea{width:100%;min-width:0;padding:10px 11px;border:1px solid #ccd4df;border-radius:8px;font:inherit;color:var(--ink);background:white}textarea{min-height:66px}#subjectCards .field{align-content:start;gap:5px;margin-top:8px}#subjectCards textarea[data-weak]{display:block;width:100%;min-height:42px;height:42px;box-sizing:border-box;padding:9px 11px;line-height:1.45;vertical-align:top;resize:none;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}button{font:inherit;cursor:pointer}.btn{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);font-weight:650}.primary{background:var(--blue);border-color:var(--blue);color:white}.danger{color:#a33}.small{font-size:12px;padding:6px 9px}.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.tag{background:var(--soft);color:#355a80;padding:3px 8px;border-radius:20px;font-size:11px}.card{border:1px solid var(--line);border-radius:9px;padding:11px;margin:9px 0}.weekhead{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px}.days{display:grid;gap:8px}.day{display:grid;grid-template-columns:115px 1fr;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px}.day strong{font-size:13px}.day small{display:block;color:var(--muted)}.notice{background:#f6f8fb;border:1px solid var(--line);padding:10px;border-radius:8px;font-size:12px;color:#566174}.empty{color:var(--muted);padding:20px;text-align:center}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#202633;color:white;padding:9px 15px;border-radius:20px;display:none}.modal-backdrop{position:fixed;inset:0;background:#17203388;z-index:10;display:grid;place-items:center;padding:18px}.modal{background:white;border-radius:14px;padding:20px;width:min(100%,380px);box-shadow:0 12px 40px #0003}.modal h2{margin:0 0 12px}.modal[hidden],.modal-backdrop[hidden]{display:none}
@media(max-width:740px){.layout{grid-template-columns:1fr}aside{position:static}.list{grid-template-columns:repeat(2,minmax(0,1fr));max-height:170px;overflow:auto}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.panel{padding:14px}.day{grid-template-columns:1fr;gap:5px}.top{align-items:flex-start}.top .actions .btn{font-size:12px;padding:7px}}
@media print{
@page{size:A4;margin:0}
body{padding:10mm!important}
html,body{width:794px!important;margin:0!important;padding:0!important;overflow:visible!important}
.wrap,.layout,#app,.print-page,.panel{width:718px!important;max-width:718px!important;margin-left:0!important;margin-right:0!important}
#app{display:block!important;position:static!important;transform:none!important;zoom:1!important}
.print-page,.panel{box-sizing:border-box!important}

body{background:#fff;font-size:8.5pt;line-height:1.3;color:#202633}
header,aside,.no-print,#toast{display:none!important}
.wrap{max-width:none;margin:0;padding:0}
.layout{display:block}
.print-page{width:100%;height:auto;min-height:0;overflow:visible;page-break-after:auto;break-after:auto}
#app>.print-page-one{page-break-after:always;break-after:page}
.print-page:last-child{page-break-after:auto;break-after:auto}
.panel{border:0;border-radius:0;padding:0;margin:0 0 5mm;break-inside:avoid}
h1{font-size:18pt;margin:0 0 2mm}
h2{font-size:11pt;margin:0 0 2mm;padding:0 0 1.5mm;border-bottom:1px solid #9aa5b4}
.sub,.hint{font-size:7.5pt;color:#596579;margin:0 0 2mm}
.print-title{display:block!important;margin:0 0 5mm;padding:0 0 3mm;border-bottom:2px solid #365f91}
.print-title h1{font-size:18pt;line-height:1.2;font-weight:750;margin:0 0 2mm;color:#202633}
.print-title p{margin:0;font-size:9pt;color:#596579}
#app>.print-page-one .grid>.field.full{display:none}
#app>.print-page-one>.panel:first-of-type .grid{grid-template-columns:1fr 1fr;gap:2mm 5mm}
#app>.print-page-one .field{gap:1mm}
#app>.print-page-one label{font-size:7.5pt}
#app>.print-page-one input,#app>.print-page-one textarea{font-size:8pt;padding:1mm 1.5mm;min-height:0;height:auto;border:0;border-bottom:1px solid #c8ced8;border-radius:0;background:transparent}
#app>.print-page-one #title{display:none}
#app>.print-page-one .print-value{display:block;min-height:6mm;padding:1mm 1.5mm;border-bottom:1px solid #c8ced8;font-size:9pt}

#app>.print-page-one #subjectCards{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 3mm}
#app>.print-page-one #subjectCards>.card{margin:0;padding:1.5mm 2mm;border:1px solid #d9dee6;border-radius:2mm;break-inside:avoid}
#app>.print-page-one #subjectCards .between{margin-bottom:1mm}
#app>.print-page-one #subjectCards b{font-size:8pt}
#app>.print-page-one #subjectCards .field{display:grid;grid-template-columns:22mm 1fr;align-items:center;gap:1mm;margin-top:.5mm}
#app>.print-page-one #subjectCards label{font-size:6.8pt;white-space:nowrap}
#app>.print-page-one #subjectCards input{width:100%;font-size:7pt;padding:.5mm 1mm}
#app>.print-page-one #subjectCards textarea[data-weak]{width:100%;min-height:7mm;height:auto;font-size:7pt;line-height:1.25;padding:.5mm 1mm;resize:none;overflow:visible;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;border:0;border-bottom:1px solid #c8ced8;border-radius:0;background:transparent}
#app>.print-page-one #weeks{display:grid;grid-template-columns:1fr 1fr;gap:2mm 3mm}
#app>.print-page-one #weeks .card{margin:0;padding:2mm;border:1px solid #d9dee6;border-radius:2mm;break-inside:avoid}
#app>.print-page-one #weeks .weekhead{margin-bottom:1mm}
#app>.print-page-one #weeks .weekhead b{font-size:8pt}
#app>.print-page-one #weeks .tag{font-size:6.5pt;padding:.5mm 1.5mm}
#app>.print-page-one #weeks textarea{width:100%;height:15mm;min-height:15mm;resize:none;white-space:pre-wrap;overflow:hidden}
#app>.print-page-one #duration{font-size:7pt;padding:1.5mm;margin-bottom:2mm}
#app>.print-page-one{page-break-after:always;break-after:page}
#app>.print-page-two{height:auto;min-height:0;page-break-after:auto;break-after:auto}
#app>.print-page-two h2{font-size:14pt;margin-bottom:2mm}
#app>.print-page-two .sub{margin-bottom:5mm}
#app>.print-page-two .days{display:grid;gap:3mm}
#app>.print-page-two .day{grid-template-columns:34mm 1fr;gap:4mm;align-items:start;margin:0;padding:3mm;border:1px solid #d9dee6;border-radius:2mm;min-height:29mm;break-inside:avoid}
#app>.print-page-two .day strong{font-size:9pt}
#app>.print-page-two .day small{font-size:7pt}
#app>.print-page-two .day textarea{height:22mm;min-height:22mm;resize:none;overflow:visible;border:0;padding:1mm;font-size:8.5pt;white-space:pre-wrap}
#app.many-subjects>.print-page-one{page-break-after:auto;break-after:auto}
#app.many-subjects .weekly-page-break{page-break-before:always;break-before:page}
#app.many-subjects>.print-page-two{page-break-before:always;break-before:page}
input,textarea,select{color:#202633}
}
.print-title{display:none}.print-value{display:none}
</style></head><body>
<header><div class="top"><div class="brand">学習計画コーチング<small>生徒ごとのテスト対策・週間計画</small></div><div class="actions no-print"><button class="btn" id="export">データ書き出し</button><button class="btn" id="import">データ読み込み</button><input type="file" id="file" accept="application/json" hidden><button class="btn primary" id="pdf">PDFを出力</button></div></div></header>
<div class="wrap"><div class="layout"><aside class="no-print"><div class="between"><b>生徒一覧</b><button class="btn primary small" id="addStudent" type="button">＋ 生徒追加</button></div><div class="list" id="students"></div><p class="hint">生徒を選択して計画を管理します。</p></aside><main id="app"><div class="panel empty">生徒を追加してください。</div></main></div></div><div id="toast"></div><div class="modal-backdrop" id="studentModal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="studentModalTitle"><h2 id="studentModalTitle">生徒を追加</h2><div class="field"><label for="studentName">生徒氏名</label><input id="studentName" type="text" autocomplete="name" placeholder="例：山田 花子"></div><div class="actions" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="cancelStudent" type="button">キャンセル</button><button class="btn primary" id="confirmStudent" type="button">追加する</button></div></section></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
<script>
const $=s=>document.querySelector(s), KEY='study_coaching_planner_v1';
let db=read(), sid=null, tid=null, editingStudentId=null;
function read(){try{const data=JSON.parse(localStorage.getItem(KEY))||{students:[]};const bad=v=>typeof v==='string'&&(/\+esc\s*\(/.test(v)||/\+\s*\[/.test(v)||/\+\s*['"\`]\s*\+/.test(v));(data.students||[]).forEach(st=>(st.tests||[]).forEach(t=>{if(bad(t.title))t.title='';['goals','weak'].forEach(k=>Object.keys(t[k]||{}).forEach(x=>{if(bad(t[k][x]))t[k][x]=''}));['weeks','days'].forEach(k=>{t[k]=(t[k]||[]).map(v=>bad(v)?'':v)})}));return data}catch(e){return {students:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));list();msg('保存しました')}
function msg(s){let e=$('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function student(){return db.students.find(x=>x.id===sid)}
function test(){return student()?.tests.find(x=>x.id===tid)}
function date(s){let a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function fmt(d){return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日月火水木金土'[d.getDay()]+'）'}
function list(){let e=$('#students');e.innerHTML=db.students.length?db.students.map(s=>'<div class="student-row"><button class="student '+(s.id===sid?'active':'')+'" data-id="'+s.id+'">'+esc(s.name)+'<small>'+s.tests.length+'件のテスト</small></button><button type="button" class="btn small" data-edit-student="'+s.id+'" aria-label="'+esc(s.name)+'の氏名を編集">編集</button></div>').join(''):'<span class="hint">登録なし</span>';e.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{sid=b.dataset.id;tid=student().tests[0]?.id||null;list();render()});e.querySelectorAll('[data-edit-student]').forEach(b=>b.onclick=()=>{openStudentModal(b.dataset.editStudent)})}
function openStudentModal(studentId=null){editingStudentId=studentId;const editing=!!studentId;$('#studentModalTitle').textContent=editing?'生徒氏名を編集':'生徒を追加';$('#confirmStudent').textContent=editing?'変更を保存':'追加する';$('#studentName').value=editing?(db.students.find(x=>x.id===studentId)?.name||''):'';$('#studentModal').hidden=false;$('#studentName').focus()}window.__openStudentDialog=()=>openStudentModal();function closeStudentModal(){$('#studentModal').hidden=true;editingStudentId=null}function createStudent(){let n=$('#studentName').value.trim();if(!n){$('#studentName').focus();return}if(editingStudentId){const s=db.students.find(x=>x.id===editingStudentId);if(s)s.name=n;closeStudentModal();save();render();return}let s={id:id(),name:n,tests:[]};db.students.push(s);sid=s.id;tid=null;closeStudentModal();save();render()}$('#addStudent').addEventListener('click',()=>openStudentModal());$('#cancelStudent').addEventListener('click',closeStudentModal);$('#confirmStudent').addEventListener('click',createStudent);$('#studentName').addEventListener('keydown',e=>{if(e.key==='Enter')createStudent()});$('#studentModal').addEventListener('click',e=>{if(e.target.id==='studentModal')closeStudentModal()});
function addTest(){let s=student();let t={id:id(),title:'',start:'',coach:new Date().toLocaleDateString('sv-SE'),subjects:[],goals:{},weak:{},weeks:[],days:Array(7).fill(''),planWeeks:null};s.tests.unshift(t);tid=t.id;save();render()}
function countWeeks(t){if(!t.start||!t.coach)return 4;let n=Math.ceil((date(t.start)-date(t.coach))/604800000);return Math.min(4,Math.max(1,n))}
function weeks(t){return t.planWeeks||countWeeks(t)}
function weekHTML(t){let n=weeks(t);return Array.from({length:n},(_,i)=>'<div class="card"><div class="weekhead"><b>第'+(i+1)+'週</b><span class="tag">'+(n-i===1?'テスト直前週':'テスト約'+(n-i)+'週間前')+'</span></div><textarea data-week="'+i+'" placeholder="この週に取り組む内容・達成目標">'+esc(t.weeks[i])+'</textarea></div>').join('')}
function daysHTML(t){let d=t.coach?date(t.coach):new Date();return Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(x.getDate()+i);return '<div class="day"><div><strong>'+fmt(x)+'</strong><small>'+(i===0?'コーチング当日':i===6?'次回コーチング前日':'学習日')+'</small></div><textarea data-day="'+i+'" placeholder="具体的な学習内容">'+esc(t.days[i])+'</textarea></div>'}).join('')}
function render(){
  const s=student();
  if(!s) return;
  const t=test();
  if(!t){
    $('#app').innerHTML='<div class="panel"><div class="between"><h2>'+esc(s.name)+' さん</h2><button class="btn primary" id="addTest" type="button">＋ テスト計画を作成</button></div><p class="hint">テストごとに科目・目標・週間計画を保存できます。</p></div>';
    $('#addTest').onclick=addTest;
    return;
  }
  const testSwitcher = (s.tests.length>1
    ? '<div class="field"><label>表示するテスト計画</label><select id="selectTest">'+s.tests.map(x=>'<option value="'+x.id+'" '+(x.id===tid?'selected':'')+'>'+esc(x.title||'テスト名未設定')+'</option>').join('')+'</select></div>'
    : '') + '<p class="hint" id="currentTestName">登録中のテスト：'+esc(t.title||'テスト名未設定')+'</p>';
  const subjectChoices = ['国語','英語【文法】','英語【コミュ】','数学【数IA】','数学【数IIB】','数学【数III】','理科【物理】','理科【化学】','理科【生物】','社会','その他'].map(x=>
    '<button type="button" class="btn small '+(t.subjects.includes(x)?'primary':'')+'" data-sub="'+x+'">'+(t.subjects.includes(x)?'✓ ':'')+x+'</button>'
  ).join('');
  const subjectCards = t.subjects.length
    ? t.subjects.map((x,i)=>
      '<div class="card"><div class="between"><b>'+esc(x)+'</b><button type="button" class="btn small danger no-print" data-remove="'+i+'">削除</button></div>'+
      '<div class="field"><label>目標</label><input data-goal="'+i+'" '+((t.goals[x]||'')? 'value="'+esc(t.goals[x])+'" ':'')+'placeholder="達成したい目標"></div>'+
      '<div class="field"><label>重点・苦手分野（任意）</label><textarea rows="1" data-weak="'+i+'" placeholder="重点的に復習する単元">'+esc(t.weak[x]||'')+'</textarea></div></div>'
    ).join('')
    : '<p class="hint">上のボタンから今回のテストで使う科目を選択してください。</p>';
  let html='';
  html+='<div class="print-page print-page-one">';
  html+='<div class="panel no-print"><div class="between"><h2>'+esc(s.name)+' さんの学習計画</h2><div class="actions"><button type="button" class="btn small" id="newTest">＋ 別のテスト</button><button type="button" class="btn small danger" id="delTest">このテストを削除</button></div></div>'+testSwitcher+'</div>';
  html+='<div class="panel"><div class="print-title"><h1 id="printTestTitle">'+esc(t.title?(t.title+"の計画表"):"計画表")+'</h1><p>'+esc(s.name)+' さん</p></div><div class="grid"><div class="field full"><label>テスト名</label><input id="title" value="'+esc(t.title||'')+'" placeholder="例：2学期期末テスト"><span class="print-value" id="printTitle">'+esc(t.title||'')+'</span></div><div class="field"><label>テスト開始日</label><input id="start" type="date" value="'+esc(t.start||'')+'"></div><div class="field"><label>コーチング実施日</label><input id="coach" type="date" value="'+esc(t.coach||'')+'"></div></div></div>';
  html+='<div class="panel"><h2>科目別の目標</h2><p class="sub">今回のテストで使用する科目を選択し、目標と重点分野を記入します。</p><div class="actions no-print" id="choices">'+subjectChoices+'</div><div id="subjectCards">'+subjectCards+'</div></div>';
  html+='<div class="panel"><h2>テストまでの学習計画</h2><p class="sub">テストまでの期間に合わせて、最大4週間分の計画を作成します。</p><div class="notice" id="duration">今回の計画期間：'+weeks(t)+'週間分</div><div id="weeks">'+weekHTML(t)+'</div><div class="actions no-print"><button type="button" class="btn small" id="recalc">期間を再計算</button></div></div>';
  html+='</div><div class="print-page print-page-two"><div class="panel"><h2>直近7日間の学習計画</h2><p class="sub">コーチング実施日から7日間の日付を表示します。</p><div class="days" id="days">'+daysHTML(t)+'</div></div></div>';
  html+='<div class="panel no-print"><div class="between"><div><h2>保存・PDF出力</h2><p class="hint">入力内容はこのブラウザ内に保存されます。</p></div><div class="actions"><button type="button" class="btn" id="save">保存する</button><button type="button" class="btn primary" id="print">PDFを出力</button></div></div><div class="notice">PDF出力後、印刷画面で「PDFに保存」を選択してください。</div></div>';
  $('#app').innerHTML=html;
  if($('#selectTest')) $('#selectTest').onchange=e=>{sync();tid=e.target.value;render()};
  $('#newTest').onclick=()=>{sync();addTest()};
  $('#delTest').onclick=()=>{if(confirm('このテスト計画を削除しますか？')){s.tests=s.tests.filter(x=>x.id!==tid);tid=s.tests[0]?.id||null;save();render()}};
  $('#title').oninput=e=>{
    t.title=e.target.value;
    const printTitle=$('#printTitle');
    if(printTitle) printTitle.textContent=t.title;const printHeading=$('#printTestTitle');if(printHeading)printHeading.textContent=t.title?(t.title+"の計画表"):"計画表";
    const label=t.title.trim()||'テスト名未設定';
    const opt=$('#selectTest')?.querySelector('option[value="'+tid+'"]');
    if(opt) opt.textContent=label;
    const current=$('#currentTestName');
    if(current) current.textContent='登録中のテスト：'+label;
  };
  function updateWeeks(){
    t.planWeeks=countWeeks(t);
    t.weeks=Array.from({length:t.planWeeks},(_,i)=>t.weeks[i]||'');
    $('#duration').textContent='今回の計画期間：'+weeks(t)+'週間分';
    $('#weeks').innerHTML=weekHTML(t);
    bindWeeks();
  }
  function bindWeeks(){
    document.querySelectorAll('[data-week]').forEach(e=>e.oninput=()=>t.weeks[+e.dataset.week]=e.value);
  }
  function bindDays(){
    document.querySelectorAll('[data-day]').forEach(e=>e.oninput=()=>t.days[+e.dataset.day]=e.value);
  }
  $('#start').onchange=e=>{t.start=e.target.value;updateWeeks()};
  $('#coach').onchange=e=>{
    t.coach=e.target.value;
    updateWeeks();
    $('#days').innerHTML=daysHTML(t);
    bindDays();
  };
  $('#choices').querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{
    sync();
    const x=b.dataset.sub;
    t.subjects=t.subjects.includes(x)?t.subjects.filter(y=>y!==x):t.subjects.concat(x);
    render();
  });
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{
    const x=t.subjects[+b.dataset.remove];
    t.subjects=t.subjects.filter(y=>y!==x);
    delete t.goals[x];
    delete t.weak[x];
    render();
  });
  document.querySelectorAll('[data-goal]').forEach(e=>e.oninput=()=>t.goals[t.subjects[+e.dataset.goal]]=e.value);
  document.querySelectorAll('[data-weak]').forEach(e=>{const fit=()=>{e.style.height='42px';e.style.height=Math.max(42,e.scrollHeight)+'px'};fit();e.oninput=()=>{t.weak[t.subjects[+e.dataset.weak]]=e.value;fit()}});
  $('#recalc').onclick=updateWeeks;
  bindWeeks();
  bindDays();
  function sync(){
    t.title=$('#title')?.value||t.title;
    t.start=$('#start')?.value||'';
    t.coach=$('#coach')?.value||'';
    document.querySelectorAll('[data-week]').forEach(e=>t.weeks[+e.dataset.week]=e.value);
    document.querySelectorAll('[data-day]').forEach(e=>t.days[+e.dataset.day]=e.value);
    document.querySelectorAll('[data-goal]').forEach(e=>t.goals[t.subjects[+e.dataset.goal]]=e.value);
    document.querySelectorAll('[data-weak]').forEach(e=>t.weak[t.subjects[+e.dataset.weak]]=e.value);
  }
  $('#save').onclick=()=>{sync();save()};
  $('#print').onclick=()=>{sync();requestPDF()};
  window.onbeforeprint=()=>{sync();const many=t.subjects.length>=7;$("#app").classList.toggle("many-subjects",many);$("#weeks")?.closest(".panel")?.classList.toggle("weekly-page-break",many)};window.onafterprint=()=>{$("#app").classList.remove("many-subjects");$("#weeks")?.closest(".panel")?.classList.remove("weekly-page-break")};
}
let pendingPDF=null;
function showPDFReady(blob,filename){
  pendingPDF={blob,filename};
  document.getElementById('pdfReadyDialog')?.remove();
  const modal=document.createElement('div');
  modal.id='pdfReadyDialog';
  modal.style.cssText='position:fixed;inset:0;z-index:10000;background:#17203399;display:grid;place-items:center;padding:20px';
  modal.innerHTML='<section style="background:white;color:#202633;border-radius:14px;padding:22px;max-width:360px;width:100%;box-shadow:0 12px 40px #0003"><h2 style="margin:0 0 10px;font-size:18px">PDFを作成しました</h2><p style="font-size:14px;line-height:1.6;margin:0 0 16px">共有メニューから「ファイルに保存」を選ぶか、PDFをダウンロードしてください。</p><div style="display:grid;gap:9px"><button id="shareReadyPDF" type="button" style="padding:11px;border:0;border-radius:8px;background:#365f91;color:white;font-weight:700">共有・ファイルに保存</button><button id="downloadReadyPDF" type="button" style="padding:11px;border:1px solid #ccd4df;border-radius:8px;background:white;color:#202633;font-weight:650">PDFをダウンロード</button><button id="closeReadyPDF" type="button" style="padding:8px;border:0;background:transparent;color:#687386">閉じる</button></div></section>';
  document.body.appendChild(modal);
  modal.querySelector('#shareReadyPDF').onclick=async()=>{
    if(!pendingPDF)return;
    const file=new File([pendingPDF.blob],pendingPDF.filename,{type:'application/pdf'});
    try{
      if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
        await navigator.share({files:[file],title:pendingPDF.filename});
      }else{
        downloadPendingPDF();
      }
    }catch(error){
      if(error?.name!=='AbortError')alert('共有メニューを開けませんでした。「PDFをダウンロード」をお試しください。');
    }
  };
  modal.querySelector('#downloadReadyPDF').onclick=downloadPendingPDF;
  modal.querySelector('#closeReadyPDF').onclick=()=>modal.remove();
}
function downloadPendingPDF(){
  if(!pendingPDF)return;
  const url=URL.createObjectURL(pendingPDF.blob);
  const a=document.createElement('a');a.href=url;a.download=pendingPDF.filename;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  msg('PDFのダウンロードを開始しました');
  document.getElementById('pdfReadyDialog')?.remove();
}
async function requestPDF(){
  const ua=navigator.userAgent||'';
  const safari=/Safari/i.test(ua)&&!/Chrome|CriOS|Edg|OPR|FxiOS|Firefox|Android/i.test(ua);
  if(safari){window.print();return;}
  if(!test()){msg('テスト計画を選択してください');return}
  if(typeof html2pdf!=='function'){alert('PDF生成機能を読み込めませんでした。通信環境を確認して、もう一度お試しください。');return}
  const source=$('#app');
  const clone=source.cloneNode(true);
  const many=test().subjects.length>=7;
  clone.classList.toggle('many-subjects',many);
  clone.querySelectorAll('.no-print').forEach(e=>e.remove());
  if(many)clone.querySelector('#weeks')?.closest('.panel')?.classList.add('weekly-page-break');
  const originalFields=source.querySelectorAll('input,textarea,select');
  const copiedFields=clone.querySelectorAll('input,textarea,select');
  originalFields.forEach((field,i)=>{
    const copy=copiedFields[i];if(!copy)return;
    if(field.tagName==='TEXTAREA')copy.textContent=field.value;
    else if(field.tagName==='SELECT')Array.from(copy.options).forEach((o,j)=>o.selected=field.options[j]?.selected);
    else copy.setAttribute('value',field.value);
  });
  const baseRules=[],printRules=[];
  function collectPrint(rules){for(const rule of rules){if(rule.type===CSSRule.MEDIA_RULE)collectPrint(rule.cssRules);else if(rule.type===CSSRule.STYLE_RULE||rule.type===CSSRule.FONT_FACE_RULE)printRules.push(rule.cssText)}}
  function collect(rules){for(const rule of rules){if(rule.type===CSSRule.MEDIA_RULE){if(rule.conditionText.includes('print'))collectPrint(rule.cssRules)}else if(rule.type===CSSRule.STYLE_RULE||rule.type===CSSRule.FONT_FACE_RULE)baseRules.push(rule.cssText)}}
  Array.from(document.styleSheets).forEach(sheet=>{try{collect(sheet.cssRules)}catch(e){}});
  const style=document.createElement('style');
  style.textContent=baseRules.join('\n')+'\n'+printRules.join('\n')+'\nbody{background:#fff!important;color:#202633!important}#app{display:block!important;width:718px!important;max-width:none!important;margin:0!important;padding:0!important}.print-page{width:100%!important;height:auto!important;min-height:0!important;overflow:visible!important}.print-page-two{height:auto!important;min-height:0!important}';
  const stage=document.createElement('div');
  stage.style.cssText='position:fixed;inset:0;overflow:auto;background:#fff;z-index:9998;padding:0;display:flex;justify-content:center';
  clone.style.cssText='width:718px;max-width:none;margin:0;padding:0;background:#fff;flex:none';
  stage.appendChild(style);stage.appendChild(clone);document.body.appendChild(stage);
  const busy=document.createElement('div');busy.textContent='PDFを作成しています…';
  busy.style.cssText='position:fixed;inset:0;z-index:9999;background:#17203388;color:white;display:grid;place-items:center;font-weight:700;font-size:18px';
  document.body.appendChild(busy);
  try{
    if(document.fonts?.ready)await document.fonts.ready;
    const filename=(test().title||'学習計画表').replace(/[\\/:*?"<>|]/g,'_')+'.pdf';
    const blob=await html2pdf().set({margin:[10,10,10,10],filename,image:{type:'jpeg',quality:0.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',windowWidth:794,scrollX:0,scrollY:0},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(clone).outputPdf('blob');
    showPDFReady(blob,filename);
  }catch(error){
    console.error(error);
    alert('PDFの作成に失敗しました。通信環境を確認して、もう一度お試しください。');
  }finally{stage.remove();busy.remove()}
}

list();if(db.students.length){sid=db.students[0].id;tid=student().tests[0]?.id||null;render()}
